# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-onekiwi"
BBFILE_PATTERN_meta-onekiwi = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-onekiwi = "6"

LAYERDEPENDS_meta-onekiwi = "core"
LAYERSERIES_COMPAT_meta-onekiwi = "dunfell"
